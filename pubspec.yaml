name: microfinance_app
description: Microfinance Collection & Operations Management App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0
  go_router: ^13.0.0
  riverpod_generator: ^2.4.0
  riverpod_lint: ^2.3.0
  intl: ^0.19.0
  flutter_slidable: ^3.1.0
  flutter_svg: ^2.0.9
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  riverpod_lint: ^2.3.0
  custom_lint: ^0.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/logo_with_name.png
    - assets/images/final_logo.png
